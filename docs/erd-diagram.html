<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.B.B.C / SellStock E-Commerce · ERD Data Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link

    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-paper: #F8FAFC;
      --color-surface: #FFFFFF;
      --color-ink: #0F172A;
      --color-ink-muted: #475569;
      --color-ink-subtle: #94A3B8;
      --color-line: rgba(15, 23, 42, 0.12);
      --color-line-strong: rgba(15, 23, 42, 0.22);
      --color-accent-teal: #0D9488;
      --color-teal-soft: rgba(13, 148, 136, 0.08);
      --color-accent-rose: #E11D48;
      --color-rose-soft: rgba(225, 29, 72, 0.08);
      --color-accent-blue: #2563EB;
      --color-blue-soft: rgba(37, 99, 235, 0.08);
      --color-accent-amber: #D97706;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1640px;
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 4px 24px -6px rgba(15, 23, 42, 0.06), 0 20px 48px -12px rgba(15, 23, 42, 0.04);
    }

    .header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--color-line);
      padding-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-accent-teal);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 2.5vw + 1rem, 2.75rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--color-ink);
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--color-ink-muted);
      margin-top: 0.4rem;
      max-width: 800px;
      line-height: 1.5;
    }

    .stats-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--color-paper);
      border: 1px solid var(--color-line);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      color: var(--color-ink-muted);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stats-badge span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--color-accent-teal);
      border-radius: 50%;
    }

    .diagram-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
      background: #FFFFFF;
      border: 1px solid var(--color-line);
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.02);
    }

    svg {
      width: 100%;
      min-width: 1540px;
      height: auto;
      display: block;
    }
  </style>
</head>
